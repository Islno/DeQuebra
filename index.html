<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De Quebra | Catálogo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#000;--card:#0c0c0c;--tx:#f2f2ee;--mut:#8d8d86;--ac:#e8f000;--rd:#c0242a;--bd:#2a2a28;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,Helvetica,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.disp{font-family:Anton,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:400}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;border-bottom:2px solid var(--ac);position:sticky;top:0;background:#000;z-index:5}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;border-radius:50%}.brand span{font-size:26px;line-height:1}
.tick{background:var(--ac);color:#000;overflow:hidden;white-space:nowrap;border-bottom:2px solid #000}
.tick div{display:inline-block;padding:7px 0;animation:mv 28s linear infinite;font-size:16px}
@keyframes mv{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.tick div{animation:none}}
main{max-width:1160px;margin:0 auto;padding:0 20px 40px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;padding:44px 0 32px;border-bottom:1px solid var(--bd);margin-bottom:24px}
.hero h1{font-size:clamp(44px,8vw,92px);line-height:.95;margin:0 0 14px}.hero h1 b{color:var(--ac);font-weight:400}
.hero p{color:var(--mut);max-width:46ch;margin:0}
.hero img{width:100%;max-width:260px;justify-self:center;filter:invert(1)}
footer{display:flex;align-items:center;gap:18px}footer img{height:84px;background:#fff;padding:6px;transform:rotate(-4deg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.chip{border:2px solid var(--bd);background:transparent;color:var(--tx);padding:6px 14px;cursor:pointer;font:inherit;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.04em}
.chip.on,.chip:hover{border-color:var(--ac);background:var(--ac);color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:2px solid var(--bd);display:flex;flex-direction:column}
.card:hover{border-color:var(--ac)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#151515;display:block}
.card>div{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:16px}.card p{margin:0;color:var(--mut);font-size:13px}
.price{font-family:Anton,Impact,sans-serif;font-size:26px;color:var(--ac)}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ac);font-weight:700}
a.btn,button.btn{background:var(--ac);color:#000;border:2px solid var(--ac);padding:10px 14px;text-align:center;text-decoration:none;cursor:pointer;font:inherit;font-weight:700;text-transform:uppercase;font-size:13px}
a.btn:hover,button.btn:hover{background:#000;color:var(--ac)}
button.sec{background:none;border:2px solid var(--bd);color:var(--tx);padding:7px 12px;cursor:pointer;font:inherit;font-weight:700;font-size:12px;text-transform:uppercase}
button.sec:hover{border-color:var(--rd);color:var(--rd)}
.panel{background:var(--card);border:2px solid var(--bd);padding:18px;margin:24px 0}
.panel h2{margin:0 0 12px;font-size:22px}
input,select,textarea{width:100%;padding:10px;border:2px solid var(--bd);border-radius:0;background:#000;color:var(--tx);font:inherit;margin-bottom:8px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}.hide{display:none!important}.mut{color:var(--mut);font-size:13px}
.fbar{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr auto;gap:8px;margin:0 0 6px}.fbar input,.fbar select{margin:0}
#empty{padding:30px 0;color:var(--mut)}
footer{border-top:2px solid var(--ac);padding:26px 24px;max-width:1160px;margin:0 auto}footer p{margin:0;color:var(--mut);font-size:13px}
@media(max-width:760px){.fbar{grid-template-columns:1fr 1fr}.fbar #q{grid-column:1/-1}}
@media(max-width:600px){.hero{grid-template-columns:1fr auto;gap:12px;padding:22px 0 18px}.hero img{width:96px}.hero h1{font-size:44px}footer img{height:64px}.row{grid-template-columns:1fr}header{padding:10px 14px}.brand span{font-size:22px}main{padding:0 12px 32px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card>div{padding:10px}.price{font-size:22px}input,select,textarea{font-size:16px}}
</style></head><body>
<header><div class="brand"><img id="logo" src="logo.webp" alt="" onerror="this.remove()"><span class="disp">De Quebra</span></div><button id="tg" class="sec">Admin</button></header>
<div class="tick"><div class="disp" id="tk"></div></div>
<main>
<section class="hero"><div><h1 class="disp">Catálogo<br>de <b>quebra</b></h1><p>Produto bom, link direto e preço na tela. Escolhe a categoria, clica e resolve.</p></div><img src="hero.webp" alt="" onerror="this.remove()"></section>

<div class="panel hide" id="lg">
  <h2 class="disp">Entrar como admin</h2>
  <input id="em" type="email" placeholder="E-mail" autocomplete="username">
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
  <button class="btn" id="li">Entrar</button>
  <p class="mut" id="lm"></p>
</div>

<div class="panel hide" id="adm">
  <h2 class="disp" id="ft">Novo produto</h2>
  <input id="pl" placeholder="Link do produto (Shopee etc.)">
  <div class="row"><input id="pn" placeholder="Nome do produto"><select id="pc"></select></div>
  <div class="row"><input id="pp" type="number" step="0.01" placeholder="Preço"><input id="pi" placeholder="URL da foto (ou envie um arquivo)"></div>
  <input id="pf" type="file" accept="image/*">
  <textarea id="pd" rows="2" placeholder="Descrição"></textarea>
  <textarea id="paste" rows="2" placeholder="Opcional: cole o texto do anúncio e clique em Preencher"></textarea>
  <div class="acts"><button class="btn" id="ps">Salvar</button><button class="sec" id="ai">Preencher do texto</button><button class="sec hide" id="pcn">Cancelar</button></div>
  <p class="mut" id="msg"></p>
  <hr style="border-color:var(--bd);margin:18px 0">
  <h2 class="disp">Categorias</h2>
  <div class="row"><input id="cn" placeholder="Nova categoria"><button class="btn" id="ca" style="margin-bottom:8px">Adicionar</button></div>
  <div class="chips" id="cl"></div>
</div>

<div class="fbar">
  <input id="q" placeholder="Buscar produto...">
  <input id="mn" type="number" placeholder="Preço mín.">
  <input id="mx" type="number" placeholder="Preço máx.">
  <select id="so"><option value="new">Mais recentes</option><option value="asc">Menor preço</option><option value="desc">Maior preço</option><option value="az">A–Z</option></select>
  <button class="sec" id="clr">Limpar</button>
</div>
<p class="mut" id="cnt"></p>
<div class="chips" id="cf"></div>
<div class="grid" id="g"></div>
<div id="empty" class="hide">Nada por aqui ainda. Volta mais tarde.</div>
</main>
<footer><img src="rodape.webp" alt="" onerror="this.remove()"><p>De Quebra. Os preços mudam, então confere no site da loja antes de fechar.</p></footer>

<script>
// ===== CONFIG =====
const SUPABASE_URL="https://opohtwavqvtfykfgzkmx.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wb2h0d2F2cXZ0ZnlrZmd6a214Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNTk0MTksImV4cCI6MjEwODkzNTQxOX0.Tklm_2VpnDjVzPqUiEeN8j41X0ug4zet34fJCvODsI0";
// ==================
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=i=>document.getElementById(i);
let sess=null,cats=[],prods=[],cur="all",edit=null,loadErr="";
const brl=v=>v==null||v===""?"":Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say=t=>$("msg").textContent=t;
const ok=r=>{if(r.error)throw r.error;return r.data};

$("tk").innerHTML=Array(4).fill("ACHADO DE QUEBRA &nbsp;//&nbsp; LINK DIRETO &nbsp;//&nbsp; SEM ENROLAÇÃO &nbsp;//&nbsp; ").join("");

async function loadData(){
  try{
    cats=ok(await sb.from("categorias").select("*").order("nome"))||[];
    prods=ok(await sb.from("produtos").select("*").order("atualizado_em",{ascending:false}))||[];
    loadErr="";
  }catch(e){loadErr="Erro ao carregar: "+(e.message||e.code)}
  render();
}

function render(){
  const adm=!!sess;
  $("adm").classList.toggle("hide",!adm);
  $("tg").textContent=adm?"Sair":"Admin";
  const chip=(id,n)=>`<button class="chip ${cur===id?"on":""}" data-c="${id}">${esc(n)}</button>`;
  $("cf").innerHTML=chip("all","Todos")+cats.map(c=>chip(c.id,c.nome)).join("");
  $("cl").innerHTML=cats.map(c=>`<span class="chip">${esc(c.nome)} <b data-dc="${c.id}" style="cursor:pointer">×</b></span>`).join("");
  const pv=$("pc").value;
  $("pc").innerHTML=(cats.length?'<option value="">Escolha a categoria</option>':'<option value="">Crie uma categoria primeiro</option>')+cats.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("");
  $("pc").value=pv;
  const q=$("q").value.trim().toLowerCase(),mn=parseFloat($("mn").value),mx=parseFloat($("mx").value),so=$("so").value;
  const l=prods.filter(p=>(cur==="all"||p.categoria_id===cur)&&(!q||((p.nome||"")+" "+(p.descricao||"")).toLowerCase().includes(q))&&(isNaN(mn)||(p.preco??0)>=mn)&&(isNaN(mx)||(p.preco??Infinity)<=mx));
  if(so==="asc")l.sort((a,b)=>(a.preco??1e12)-(b.preco??1e12));
  else if(so==="desc")l.sort((a,b)=>(b.preco??-1)-(a.preco??-1));
  else if(so==="az")l.sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt"));
  $("cnt").textContent=loadErr||(prods.length?l.length+" de "+prods.length+" produtos":"");
  $("empty").classList.toggle("hide",l.length>0||!!loadErr);
  $("g").innerHTML=l.map(p=>{
    const safe=/^https?:\/\//i.test(p.link||"");
    return `<div class="card"><img src="${esc(p.foto_url||"")}" alt="" loading="lazy"><div>
    <span class="tag">${esc((cats.find(c=>c.id===p.categoria_id)||{}).nome||"Sem categoria")}</span>
    <h3>${esc(p.nome)}</h3><span class="price">${brl(p.preco)}</span><p>${esc(p.descricao)}</p>
    ${safe?`<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">Ver produto</a>`:""}
    ${adm?`<div class="acts"><button class="sec" data-e="${p.id}">Editar</button><button class="sec" data-d="${p.id}">Excluir</button></div>`:""}
    </div></div>`}).join("");
}

document.addEventListener("click",async e=>{
  const t=e.target;
  try{
    if(t.dataset.c){cur=t.dataset.c;render()}
    if(t.dataset.dc&&confirm("Excluir categoria? Os produtos dela ficam sem categoria.")){ok(await sb.from("categorias").delete().eq("id",t.dataset.dc).select());await loadData()}
    if(t.dataset.d&&confirm("Excluir produto?")){ok(await sb.from("produtos").delete().eq("id",t.dataset.d).select());await loadData()}
    if(t.dataset.e){
      edit=prods.find(p=>p.id===t.dataset.e);
      $("pn").value=edit.nome;$("pc").value=edit.categoria_id||"";$("pp").value=edit.preco??"";
      $("pl").value=edit.link||"";$("pd").value=edit.descricao||"";$("pi").value=edit.foto_url||"";
      $("ft").textContent="Editar produto";$("pcn").classList.remove("hide");scrollTo(0,0);
    }
  }catch(err){alert("Erro: "+(err.message||err.code))}
});

function reset(){edit=null;["pn","pp","pl","pd","pi","paste"].forEach(i=>$(i).value="");$("pf").value="";$("ft").textContent="Novo produto";$("pcn").classList.add("hide")}
$("pcn").onclick=reset;

// Login / logout
$("tg").onclick=async()=>{
  if(sess){await sb.auth.signOut();return}
  $("lg").classList.toggle("hide");
};
$("li").onclick=async()=>{
  $("lm").textContent="Entrando...";
  const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error){$("lm").textContent="Não deu: "+error.message;return}
  $("pw").value="";$("lm").textContent="";$("lg").classList.add("hide");
};
sb.auth.onAuthStateChange((_ev,s)=>{sess=s;render()});
sb.auth.getSession().then(({data})=>{sess=data.session;render()});

// Categorias
$("ca").onclick=async()=>{
  const n=$("cn").value.trim();if(!n)return;
  try{ok(await sb.from("categorias").insert({nome:n}).select());$("cn").value="";await loadData()}
  catch(e){alert("Erro: "+(e.message||e.code))}
};

// Foto: reduz para 800px antes de enviar
async function resizeImg(f){
  const b=await createImageBitmap(f),s=Math.min(1,800/Math.max(b.width,b.height));
  const c=document.createElement("canvas");c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);
  c.getContext("2d").drawImage(b,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",.8));
}

// Salvar produto
$("ps").onclick=async()=>{
  const nome=$("pn").value.trim();
  if(!nome)return say("Informe o nome.");
  if(!$("pc").value)return say("Escolha a categoria do produto.");
  say("Salvando...");
  try{
    let foto=$("pi").value.trim();
    const f=$("pf").files[0];
    if(f){
      const blob=await resizeImg(f),path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
      const up=await sb.storage.from("fotos").upload(path,blob,{contentType:"image/jpeg"});
      if(up.error)throw up.error;
      foto=sb.storage.from("fotos").getPublicUrl(path).data.publicUrl;
    }
    const preco=parseFloat($("pp").value);
    const d={nome,categoria_id:$("pc").value,preco:isNaN(preco)?null:preco,link:$("pl").value.trim()||null,descricao:$("pd").value.trim()||null,foto_url:foto||null,atualizado_em:new Date().toISOString()};
    if(!edit||edit.preco!==d.preco)d.preco_atualizado_em=new Date().toISOString();
    if(edit)ok(await sb.from("produtos").update(d).eq("id",edit.id).select());
    else ok(await sb.from("produtos").insert(d).select());
    reset();say("Salvo.");await loadData();
  }catch(e){say("Erro: "+(e.message||e.code))}
};

// Ajudas de preenchimento
$("ai").onclick=()=>{
  const t=$("paste").value.trim();if(!t)return say("Cole o texto primeiro.");
  const nm=t.match(/^[^\n]+/),pr=t.match(/(?:R\$\s*)?(\d+[\.,]\d{2})/);
  if(nm)$("pn").value=nm[0].trim();
  if(pr)$("pp").value=pr[1].replace(",",".");
  $("pd").value=t.slice(0,200);
  say("Dados extraídos. Confira e salve.");
};
$("pl").addEventListener("input",()=>{
  const v=$("pl").value.trim();if(!v||$("pn").value)return;
  try{
    const u=new URL(v),seg=decodeURIComponent(u.pathname.split("/").filter(Boolean).pop()||"");
    const nm=seg.replace(/-i\.\d+\.\d+.*$/,"").replace(/[-_]+/g," ").trim();
    if(nm.length>6&&!/^\d+$/.test(nm)){$("pn").value=nm;say("Nome puxado do link. Confira e complete preço e foto.")}
  }catch(e){}
});

["q","mn","mx","so"].forEach(i=>$(i).addEventListener("input",render));
$("clr").onclick=()=>{$("q").value=$("mn").value=$("mx").value="";$("so").value="new";cur="all";render()};

loadData();
</script></body></html>
